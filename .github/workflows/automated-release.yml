name: Automated Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (e.g. 1.0.0)'
        required: false
      developmentVersion:
        description: 'Next development version (e.g. 1.0.1-SNAPSHOT)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for tags

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git user
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}

      - name: Prepare and Perform Release
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git checkout -b maven-release-automation

          mvn -B release:prepare \
            -DpushChanges=false \
            -DreleaseVersion=${{ inputs.releaseVersion }} \
            -DdevelopmentVersion=${{ inputs.developmentVersion }} \
            -Darguments="-DskipTests -Prelease -Dgpg.passphrase='${{ secrets.GPG_PASSPHRASE }}'"

          mvn -B release:perform \
            -DlocalCheckout=true \
            -Darguments="-DskipTests -Prelease -Dgpg.passphrase='${{ secrets.GPG_PASSPHRASE }}'"

          git push origin maven-release-automation
          git push origin --tags

          gh pr create \
            --title "chore: release versions bump" \
            --body "Automated version updates generated by Maven Release Plugin inside GitHub Actions." \
            --base main \
            --head maven-release-automation
